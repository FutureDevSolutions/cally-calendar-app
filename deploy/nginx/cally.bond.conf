# cally.bond — nginx reverse proxy
# Install to /etc/nginx/sites-available/cally.bond.conf and symlink into sites-enabled

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name cally.bond www.cally.bond;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cally.bond www.cally.bond;

    # TLS — replace with your cert paths (certbot: /etc/letsencrypt/live/cally.bond/)
    ssl_certificate /etc/letsencrypt/live/cally.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cally.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upload size (booking attachments, avatars, etc.)
    client_max_body_size 25m;

    # Long-polling / SSE-friendly timeouts
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # API v2 (NestJS) — /api/v2 -> calcom-api:5555
    location /api/v2 {
        proxy_pass http://calcom_api:5555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else -> Next.js web app
    location / {
        proxy_pass http://calcom_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
