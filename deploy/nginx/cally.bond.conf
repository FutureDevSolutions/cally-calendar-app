# cally.bond — reference nginx for FDS-DnS edge proxy
# Canonical live config lives in the FDS-DnS repo:
#   ServerDNS/sites-available/cally.bond.conf
#
# Traffic path:
#   Internet -> FDS-DnS nginx (:443) -> 192.168.194.35:3001 -> cally_web container (:3000)
#
# Do NOT install this file on the app host unless you are running nginx locally
# instead of FDS-DnS. Prefer editing FDS-DnS and deploying that repo.

# HTTP -> HTTPS
server {
    listen 80;
    server_name cally.bond www.cally.bond socket.cally.bond *.cally.bond;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cally.bond www.cally.bond;

    ssl_certificate /etc/nginx/certs/cally.bond.pem;
    ssl_certificate_key /etc/nginx/certs/cally.bond.key;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;

    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 300M;
    proxy_buffer_size 256k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 512k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://192.168.194.35:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name socket.cally.bond;

    ssl_certificate /etc/nginx/certs/cally.bond.pem;
    ssl_certificate_key /etc/nginx/certs/cally.bond.key;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;

    client_max_body_size 300M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://192.168.194.35:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name *.cally.bond;

    ssl_certificate /etc/nginx/certs/cally.bond.pem;
    ssl_certificate_key /etc/nginx/certs/cally.bond.key;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;

    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 300M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://192.168.194.35:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
